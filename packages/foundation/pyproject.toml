[project]
name = "foundation"
version = "0.1.0"
description = "Shared code used across the mmp packages"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "finnhub-python>=2.4.24",
    "numpy",
    "pandas",
    "pydantic>=2.14.3",
    "python-dateutil",
    "robin-stocks>=3.4.0",
    "scikit-learn",
    "sqlalchemy>=2.1.8",
    "yfinance>=0.2.65",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
