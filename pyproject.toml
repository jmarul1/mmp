[project]
name = "mmp"
version = "0.1.0"
description = "Workspace root for the mmp packages"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev", "research"]

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "ty>=0.0.104",
]
research = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]

[tool.ruff]
extend-exclude = ["work"]

[tool.ruff.lint]
select = [
    "E4",       # import errors (E401 multiple imports on one line, E402 import not at top)
    "E7",       # statement errors (E711 comparison to None, E721 type comparison, ...)
    "E9",       # runtime errors: syntax errors, IO errors
    "F",        # pyflakes: unused imports, undefined names
    "W",        # pycodestyle warnings
    "I",        # import sorting (isort)
    "UP",       # pyupgrade: use newer syntax for the target Python version
    "B",        # bugbear: likely bugs, e.g. zip() without strict=
    "SIM",      # simplifications, e.g. redundant if/else, any() instead of a loop
    "C4",       # comprehension cleanups, e.g. tuple([a, b]) instead of (a, b)
    "RUF",      # ruff-specific checks, e.g. implicit Optional, unused noqa
    "PLW1510",  # subprocess.run without an explicit check=
]

[tool.ty.src]
include = ["packages/*/src"]
